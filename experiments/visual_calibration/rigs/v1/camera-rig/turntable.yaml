# The rig's turntable: its own controller board (an OH board, not the hand's)
# with one XC430 on its bus, in direct multi-turn position control. Driven
# through orca_core's motor client (visual_calibration/turntable.py). What the
# motor calibration measures (which motor position is which plate angle) goes
# to turntable_calibration.yaml. Angles in degrees.

board:
  port: auto                 # auto: the board whose bus has exactly one motor (the hand's has 17)
  usb_serial: FC9578875154393741202020FF012940FC9578875154393741202020FF012940   # the rig board only; never scans the hand's (null: any board with one motor)
  baudrates: [1000000, 3000000, 57600]   # tried in order when scanning; 57600 = factory default
  id_range: [0, 20]

motor:
  type: dynamixel
  id: auto                   # or the motor's id
  model: XC330-T288-T
  operating_mode: 4          # multi-turn position: the plate turns 320°, more than the in-turn range allows around 0
  gear_ratio: 1.0            # motor turns per plate turn; -1.0 if the motor turns the other way
  # Slow and soft on purpose: the XC430-T240BB-T has no current control, the PWM cap is
  # all that limits the force on the stop. Every move (CLI, sweep, the UI) uses these.
  # Any error or Ctrl-C releases the torque.
  speed_deg_s: 10.0          # plate speed of a move
  homing_speed_deg_s: 5.0    # plate speed into the hard stop
  pwm: 0.3                   # output cap (fraction of the PWM limit): pushes the stop, not the rig apart
  stall_lag_deg: 3.5         # goal ahead of the plate by this much: blocked (homing: the stop)
  search_margin_deg: 20.0    # homing gives up after travel + this without a stop (no endless pushing)
  position_p_gain: 1200       # XC330-T288-T (2026-11-09): 400 left 1.5° droop; XC430 hunted at 700
  hold_after_move: false     # torque off whenever the plate stops (only a sweep holds between its stops)

# Where the plate parks to swap the object for the hand (torque off after): the
# connector's two rods side by side across the view, both reachable; mid travel.
swap_angle: 180.0

# One one-way hard stop. 0° = the fin pressed against the arm.
hard_stop:
  arm:                       # fixed on the base: 125..145°
    stop_center_angle: 135.0
    stop_arm_half_angle: 10.0
  fin:                       # turns with the plate
    fin_angle: 20.0          # sector width
    fin_contact_angle: 145.0

# 360 - fin_angle - 2 * stop_arm_half_angle: every extra degree of fin or
# arm width costs one degree of travel. Checked against the hard stop.
travel: 320.0

# The sweep: photos at start, start + step, ... (count stops), all within
# the travel. Always approached from the hard stop side.
stops:
  start: 0.0
  step: 15.0
  count: 22                  # 0..315°
  settle_s: 0.5              # wait after each move before the photo
  home_each_sweep: true      # drive into the hard stop before every sweep

# The motor calibration: home into the stop `repeats` times, then run to the
# stop's other side. Fails when the homings spread more than repeat_tol_deg or
# the measured travel is off the design by more than travel_tol_deg (a wrong
# gear_ratio, or something in the way).
motor_calibration:
  repeats: 3
  repeat_tol_deg: 0.5
  travel_tol_deg: 5.0
  backoff_deg: 1.0           # off the stop after homing, so the fin never rests pressed
