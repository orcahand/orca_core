name: Run Tests on Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  test-matrix:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run Tests
        run: |
          uv run pytest --durations=40

  # Single check named "test" for the main ruleset; passes only if every matrix leg passed.
  test:
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-matrix.result }}" = "success"
