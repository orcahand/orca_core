name: Run Tests on Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  test-matrix:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The oldest Python the package supports and the newest release.
        python: ['3.10', '3.15']
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run Tests
        run: |
          uv run pytest

  # Single check named "test" for the main ruleset; passes only if every matrix leg passed.
  test:
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-matrix.result }}" = "success"
