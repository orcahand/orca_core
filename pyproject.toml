[project]
name = "orca_core"
version = "0.14.0"
description = "Core Python Controller of the ORCA Hand. Handles all hardware interaction, logic and abstracts control. Provides API for basic functionality and info of the hand."
authors = [
    {name = "clemens-chr", email = "cchristoph@student.ethz.ch"},
    {name = "fabricenoelbourquin", email = "fabrice.bourquin@protonmail.ch"},
    {name = "maximilianeberlein", email = "meberlein@ethz.ch"},
    {name = "fracapuano", email = "capuano@robots.ox.ac.uk"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dynamixel-sdk (>=3.7.31,<4.0.0)",
    "pyserial (>=3.5,<4.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "fastapi (>=0.115.12,<1.0.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
    "numpy (>=2.2.6,<3.0.0)",
]

[project.optional-dependencies]
# The camera rig (experiments/visual_calibration): tile detection (aruco), the
# BiRefNet hand segmenter and what its remote code imports, the hand run's
# websocket client. Lower bounds: the versions the rig code was run with (on
# Python 3.12). They need Python 3.11+: on 3.10 the extra installs nothing.
rig = [
    "opencv-contrib-python-headless>=4.13,<6; python_version >= '3.11'",
    "torch>=2.10; python_version >= '3.11'",
    "torchvision>=0.25; python_version >= '3.11'",
    "transformers>=5.24,<6; python_version >= '3.11'",   # BiRefNet's remote code breaks across majors
    "timm>=1.0.31; python_version >= '3.11'",
    "kornia>=0.9.2; python_version >= '3.11'",
    "einops>=0.8.2; python_version >= '3.11'",
    "websockets>=12; python_version >= '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9.0.0",
    "httpx>=0.27,<1.0",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.100,<7",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-autorefs==1.4.2",
    "mkdocs-awesome-pages-plugin==2.10.1",
    "mkdocs-get-deps==0.2.0",
    "mkdocs-material==9.5.0",
    "mkdocs-material-extensions==1.3.1",
    "mkdocstrings==0.29.1",
    "mkdocstrings-python==1.16.12",
    "pymdown-extensions==10.8.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n auto fans the suite across cores; it is thread- and file-safe (every test
# that writes goes through tmp_path). Pass -n0 for readable output when
# debugging a single failure.
addopts = "-n auto"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orca_core"]
