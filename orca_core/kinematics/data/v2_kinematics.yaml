# Kinematic constants for the v2 ORCA hand, used by orca_core.kinematics.
# Regenerate with tools/extract_urdf_kinematics.py.
#
# chains: per-joint origins and axes (xyz meters, extrinsic-XYZ rpy radians).
#   sign relates an orca_core joint angle to the rotation direction about axis.
#   Positive abduction rotates every finger toward the pinky.
# sensor_mounts: fixed pose of each tactile-sensor frame in its distal link
#   frame. Left mounts equal right: the left fingertip meshes are identical
#   geometry, since hand mirroring happens upstream in the kinematic tree.
version: 2
