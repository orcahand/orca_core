# chains: extracted from orcahand_description v2 URDFs by
#   scripts/extract_urdf_kinematics.py (joint origins/axes in meters/radians;
#   sign relates orca_core joint angles to URDF axis direction, audited
#   against config joint_roms vs URDF limits).
# sensor_mounts: fixed pose of each Paxini tactile-sensor frame in its distal
#   link frame (URDF-style xyz meters / extrinsic-XYZ rpy radians), recovered
#   by mesh registration of the vendor sensor geometry onto the fingertip
#   meshes (sub-0.05 mm residuals). Left mounts equal right: the left fingertip meshes are identical
#   geometry (hand mirroring happens upstream in the kinematic tree),
#   verified by an independent re-fit against the left assets.
