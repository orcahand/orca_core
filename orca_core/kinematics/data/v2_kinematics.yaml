# Kinematic constants for the v2 ORCA hand, used by orca_core.kinematics.
#
# right: extracted from the orcahand_description v2 right URDF with
#   tools/extract_urdf_kinematics.py; the wrist origin carries no roll, matching
#   the MuJoCo model.
# left: the exact sagittal-plane (x=0) reflection of the right, so the two hands
#   are mirror-identical by construction rather than modelled separately.
#
# chains: per-joint origins and axes (xyz meters, extrinsic-XYZ rpy radians).
#   sign relates an orca_core joint angle to the rotation direction about axis.
#   Positive abduction rotates every finger toward the pinky.
# sensor_mounts: fixed pose of each tactile-sensor frame in its distal link
#   frame, reflected between hands along with the chain.
version: 2
right:
  chains:
    base_chain:
    - fixed: true
      xyz: [-0.01, 0.0523, 0.0]
      rpy: [-1.570796327, 1.570796327, 0.0]
    - joint: wrist
      xyz: [0.0, 0.0, 0.04]
      rpy: [0.0, 0.0, -1.570796327]
      axis: [-1.0, 0.0, 0.0]
      sign: 1
    fingers:
      thumb:
      - joint: thumb_cmc
        xyz: [-0.028398719, 0.010997181, 0.030589533]
        rpy: [0.66149514, 0.386056856, -1.432867705]
