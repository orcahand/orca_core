        rpy: [-1.529473574, 1.202862211, -2.911989536]
        axis: [0.0, 0.0, 1.0]
        sign: -1
      - joint: pinky_mcp
        xyz: [-0.01775, 0.0, -0.001]
        rpy: [0.0, -1.570796327, 0.0]
        axis: [0.0, -1.0, 0.0]
        sign: 1
      - joint: pinky_pip
        xyz: [0.001, 0.0, 0.031]
        rpy: [0.0, 0.0, 0.0]
        axis: [0.0, -1.0, 0.0]
        sign: 1
  sensor_mounts:
