calibration_current: 300
calibration_step_size: 0.15
calibration_step_period: 0.0001
calibration_num_stable: 10
calibration_threshold: 0.01
calibration_sequence:
- step: 1
  joints:
    thumb_cmc: flex
- step: 2
  joints:
    thumb_cmc: extend
- step: 3
  joints:
    thumb_abd: flex
- step: 4
  joints:
    thumb_abd: extend
- step: 5
  joints:
    thumb_mcp: flex
- step: 6
  joints:
    thumb_mcp: extend
- step: 7
  joints:
    thumb_dip: flex
- step: 8
  joints:
    thumb_dip: extend
- step: 9
  joints:
    index_abd: flex
    middle_abd: flex
    ring_abd: flex
    pinky_abd: flex
- step: 10
  joints:
    index_abd: extend
    middle_abd: extend
    ring_abd: extend
    pinky_abd: extend
- step: 11
  joints:
    index_mcp: flex
    middle_mcp: flex
    ring_mcp: flex
    pinky_mcp: flex
- step: 12
  joints:
    index_mcp: extend
    middle_mcp: extend
    ring_mcp: extend
    pinky_mcp: extend
- step: 13
  joints:
    index_pip: flex
    middle_pip: flex
    ring_pip: flex
    pinky_pip: flex
- step: 14
  joints:
    index_pip: extend
    middle_pip: extend
    ring_pip: extend
    pinky_pip: extend
- step: 15
  joints:
    wrist: flex
- step: 16
  joints:
    wrist: extend
# Re-drive attempts for a joint that finishes short of its joint_motor_travel
# baseline. Each attempt clears the joint's limits and re-sweeps it
# flex-then-extend at a raised current; that re-sweep is the mid-sweep
# direction reversal previously seen on the thumb, so watch the thumb on the
# first run after changing this. Several attempts rather than one so the
# current ramps in gradually instead of jumping straight to the top.
calibration_travel_retries: 3

# Motor-shaft travel between each joint's hardstops, in degrees, measured by
# scripts/measure_travel.py. Calibration reports a joint that falls more than
# calibration_travel_margin short of its entry.
joint_motor_travel:
  wrist: 167.17
  thumb_cmc: 38.76
  thumb_abd: 43.33
  thumb_mcp: 118.39
  thumb_dip: 102.92
  index_abd: 44.74
