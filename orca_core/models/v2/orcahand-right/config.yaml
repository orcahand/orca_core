# motor_type and baudrate are auto-detected at connect; set them here to pin a driver
port: auto
max_current: 300
# Ceiling for the calibration short-travel re-drive alone (mA). Above
# max_current on purpose: freeing a joint from an over-tensioned tendon needs
# more torque than the hand may use in normal operation, and the routine puts
# max_current back the moment calibration ends.
calibration_max_current: 500
type: right
control_mode: current_based_position
