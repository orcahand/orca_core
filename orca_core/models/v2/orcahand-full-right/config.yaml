  - -45
  - 33
  thumb_abd:
  - -18
  - 55
  thumb_mcp:
  - -25
  - 100
  thumb_dip:
  - -15
  - 107
  index_abd:
  - -25
  - 30
  index_mcp:
  - -25
  - 100
  index_pip:
  - -15
  - 107
  middle_abd:
  - -27
  - 27
  middle_mcp:
  - -25
  - 100
  middle_pip:
  - -15
  - 107
  ring_abd:
  - -27
  - 27
  ring_mcp:
  - -25
  - 100
  ring_pip:
  - -15
  - 107
  pinky_abd:
  - -30
  - 30
