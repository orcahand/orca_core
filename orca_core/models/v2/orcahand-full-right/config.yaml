  thumb_cmc: 0
  thumb_abd: 50
  thumb_mcp: 33
  thumb_dip: 18
  index_abd: -14
  index_mcp: 2
  index_pip: 6
  middle_abd: -4
  middle_mcp: 2
  middle_pip: 4
  ring_abd: 10
  ring_mcp: -2
  ring_pip: 8
  pinky_abd: 22
  pinky_mcp: -4
  pinky_pip: -2
  wrist: -20
calibration_current: default
# v2.1 only: calibration current per joint group (mA) for a motor family,
# replacing calibration_current for those joints. abd: the abductions and
# thumb_cmc; mcp: the MCPs; pip: the PIPs and thumb_dip. A family not listed
# keeps calibration_current.
calibration_current_v21:
  dynamixel:
    abd: 300
    mcp: 500
    pip: 500
calibration_step_size: 0.15
calibration_step_period: 0.0001
calibration_num_stable: 10
calibration_threshold: 0.01
use_joint_feedback: true
joint_encoder_joints:
- all
encoder_serial_port: auto
encoder_baudrate: 2000000
calibration_sequence:
- step: 1
  joints:
    thumb_cmc: flex
- step: 2
  joints:
    thumb_cmc: extend
- step: 3
  joints:
    thumb_abd: flex
- step: 4
  joints:
    thumb_abd: extend
- step: 5
  joints:
    thumb_mcp: flex
- step: 6
  joints:
    thumb_mcp: extend
- step: 7
  joints:
    thumb_dip: flex
- step: 8
  joints:
    thumb_dip: extend
- step: 9
  joints:
    index_abd: flex
    middle_abd: flex
    ring_abd: flex
    pinky_abd: flex
- step: 10
  joints:
    index_abd: extend
    middle_abd: extend
    ring_abd: extend
    pinky_abd: extend
- step: 11
  joints:
    index_mcp: flex
    middle_mcp: flex
    ring_mcp: flex
    pinky_mcp: flex
- step: 12
  joints:
    index_mcp: extend
    middle_mcp: extend
    ring_mcp: extend
    pinky_mcp: extend
- step: 13
  joints:
    index_pip: flex
    middle_pip: flex
    ring_pip: flex
    pinky_pip: flex
- step: 14
  joints:
    index_pip: extend
    middle_pip: extend
    ring_pip: extend
    pinky_pip: extend
- step: 15
  joints:
    wrist: flex
- step: 16
  joints:
    wrist: extend
sensors:
  port: auto
  finger_to_sensor_id:
    thumb: 0
    index: 1
    middle: 2
    ring: 3
    pinky: 4

# Which hardware revision this hand is. `auto` takes the version the OH
# board reports (2 or 21). A hand on a plain adapter has no board to ask:
# pin it here instead -- `hardware_version: 21` for the v2.1 build. A pin
# beats the board and the clash is logged.
hardware_version: auto

# Motor travel between each joint's hardstops on v2.1 hardware, in degrees.
# Only a v2.1 hand uses it: calibration re-drives a joint that falls short
# of it, and guided tensioning scores slack against it. v2.0 hands have none.
joint_motor_travel_v21:
  wrist: 156.18
  thumb_cmc: 57.57
  thumb_abd: 56.25
  thumb_mcp: 116.1
  thumb_dip: 96.86
  index_abd: 39.11
  index_mcp: 139.39
  index_pip: 131.04
  middle_abd: 47.9
  middle_mcp: 132.01
  middle_pip: 103.36
  ring_abd: 49.75
  ring_mcp: 143.09
  ring_pip: 112.85
  pinky_abd: 49.13
  pinky_mcp: 113.91
  pinky_pip: 115.84
